name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        mcp: ["mcp>=1.2,<2", "mcp>=2"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: uv sync --python ${{ matrix.python }}
      - name: Pin MCP SDK generation
        run: uv pip install "${{ matrix.mcp }}"
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Offline tests with coverage
        run: uv run --no-sync pytest -q --cov=iran_bourse_mcp --cov-report=term-missing
      - name: CLI smoke
        run: |
          uv run --no-sync iran-bourse-mcp tools | head -3
          uv run --no-sync iran-bourse-mcp config cursor | head -5
          uv run --no-sync iran-bourse-mcp call glossary term=صف --compact | head -c 200

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t iran-bourse-mcp:ci .
      - name: Smoke test the image
        run: docker run --rm iran-bourse-mcp:ci --version

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Tool reference and screener guide are up to date
        run: |
          uv run python scripts/gen_tools_doc.py
          uv run python scripts/gen_screener_doc.py
          git diff --exit-code docs/TOOLS.md docs/SCREENER.md
