name: Publish to PyPI

# Enable by configuring PyPI "trusted publishing" for this repository, then set the repository
# variable PUBLISH_PYPI=true and push a tag like v0.2.0.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
